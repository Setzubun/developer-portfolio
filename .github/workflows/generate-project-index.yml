name: Generate Project Index

on:
  push:

jobs:
  generate-index:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Index
        run: node scripts/generate-project-index.js

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/project-index.json

          git diff --cached --quiet || git commit -m "Auto-update project index"

          git push